<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- THEME FLASH FIX                                         -->
    <!-- Runs before React loads, reads saved theme from         -->
    <!-- localStorage and applies 'dark' class instantly —       -->
    <!-- prevents white flash on page load in dark mode.         -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved === "dark" || (!saved && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>

    <!-- ═══ Favicon ═══ -->
    <!-- Replace /favicon.ico with your own icon file -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- ═══ Primary Meta Tags ═══ -->
    <title>AsadUllah | Frontend Developer — React & Next.js</title>
